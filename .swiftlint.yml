disabled_rules:
  - todo
  - line_length
  - trailing_comma

opt_in_rules:
  - sorted_imports
  - file_header
  - empty_count
  - explicit_init
  - first_where
  - redundant_nil_coalescing

included:
  - Apps
  - Packages

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/Derived"
  - "**/Tests"

identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

type_name:
  allowed_symbols: ["_"]

large_tuple:
  warning: 4

function_body_length:
  warning: 80

cyclomatic_complexity:
  warning: 15

function_parameter_count:
  warning: 7

custom_rules:
  no_string_literals_in_swiftui_text:
    name: "SwiftUI Text with raw string literal"
    regex: 'Text\("[^"]+"\)'
    message: "Wrap user-facing strings in String(localized:) before passing to Text."
    severity: warning
    match_kinds:
      - identifier
      - typeidentifier
