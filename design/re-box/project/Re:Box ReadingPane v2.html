<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Re:Box · ReadingPane v2 — 7 concepts</title>
<link rel="stylesheet" href="app/colors_and_type.css" />
<link rel="stylesheet" href="app/app.css" />
<link rel="stylesheet" href="app/cards-v2.css" />
<style>
  /* Canvas chrome */
  html, body, #root { height: 100%; }
  body { background: #0e1014; }
  .dc-section-title { color: #f5f1e6 !important; }
  .dc-section-subtitle { color: #8a8d92 !important; }
  .dc-artboard-label { color: #b0b3b8 !important; font-family: "JetBrains Mono", monospace !important; font-size: 11px !important; letter-spacing: .06em; }
  /* Make sure each artboard renders Re:Box dark surfaces, not the page bg */
  .rb2-artboard-shell {
    width: 100%; height: 100%;
    background: var(--bg-canvas, #0e1014);
    color: var(--fg-1, #f5f1e6);
    overflow: hidden;
    border-radius: 6px;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-theme="dark">
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app/cards-v2.jsx"></script>

<script type="text/babel">
const { Card1, Card2, Card3, Card4, Card5, Card6, Card7 } = window.RB2;

function Shell({ children }) {
  return <div className="rb2-artboard-shell">{children}</div>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="readingpane-v2"
        title="ReadingPane v2 · «AI работает на тебя»"
        subtitle="Семь концептов, как углубить принцип: AI подтверждает, выбирает за тебя, схлопывает choices в один primary action."
      >
        <DCArtboard id="c1" label="01 · One primary action per thread" width={760} height={460}>
          <Shell><Card1 /></Shell>
        </DCArtboard>

        <DCArtboard id="c2" label="02 · Living brief — every field is interactive" width={400} height={560}>
          <Shell><Card2 /></Shell>
        </DCArtboard>

        <DCArtboard id="c3" label="03 · Progressive composer + hover rephrase" width={680} height={720}>
          <Shell><Card3 /></Shell>
        </DCArtboard>

        <DCArtboard id="c4" label="04 · AI summaries in thread-list preview" width={420} height={620}>
          <Shell><Card4 /></Shell>
        </DCArtboard>

        <DCArtboard id="c5" label="05 · «Done» — terminal state after Send" width={760} height={500}>
          <Shell><Card5 /></Shell>
        </DCArtboard>

        <DCArtboard id="c6" label="06 · Ambient FYI — AI confirms «nothing to do»" width={400} height={400}>
          <Shell><Card6 /></Shell>
        </DCArtboard>

        <DCArtboard id="c7" label="07 · Morning briefing — Inbox click → grouped summary" width={840} height={680}>
          <Shell><Card7 /></Shell>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
